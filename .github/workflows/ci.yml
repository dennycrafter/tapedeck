name: CI

# Runs every automated check (SPEC 9.0) on every push to main and every pull
# request: type check, lint, Vitest, pytest, and Playwright on all three
# projects (desktop, iphone/WebKit, android). @live tests are left out; they
# run only after go-live via `npm run e2e:live`.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            agent/requirements.txt
            agent/requirements-dev.txt

      - name: Repo hygiene (SPEC T7)
        run: bash scripts/check-repo.sh

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install downloader dependencies
        run: python -m pip install -r agent/requirements.txt -r agent/requirements-dev.txt

      - name: pytest (agent)
        working-directory: agent
        run: python -m pytest -q

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Type check
        working-directory: web
        run: npx tsc --noEmit

      - name: Lint
        working-directory: web
        run: npx eslint

      - name: Vitest (web)
        working-directory: web
        run: npx vitest run

      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps chromium webkit

      - name: Playwright (all projects, no @live)
        working-directory: web
        env:
          E2E_PYTHON: python
        run: npx playwright test --grep-invert @live

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
